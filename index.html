<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Biblioteca Virtual</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- ENCABEZADO -->
<header>
    <div class="logo">
        📚 Biblioteca Virtual
    </div>

    <nav>
        <button id="btnInicio">Inicio</button>
        <button id="btnBiblioteca">Biblioteca</button>
        <button id="btnCrear">Crear</button>
    </nav>
</header>


<!-- CONTENIDO PRINCIPAL -->
<main>

    <!-- PANTALLA DE INICIO -->
    <section id="inicio" class="pantalla">

        <div class="bienvenida">

            <h1>Bienvenido a Biblioteca Virtual 📚</h1>

            <p>
                Lee, escribe y descubre nuevas historias.
            </p>

            <div class="botones-inicio">
                <button id="irBiblioteca">
                    📖 Explorar biblioteca
                </button>

                <button id="irCrear">
                    ✍️ Crear una historia
                </button>
            </div>

        </div>

    </section>


    <!-- BIBLIOTECA -->
    <section id="biblioteca" class="pantalla">

        <h2>📚 Biblioteca</h2>

        <!-- BUSCADOR -->
        <div class="buscador">

            <input
                type="text"
                id="buscar"
                placeholder="Buscar un libro..."
            >

            <select id="filtroCategoria">

                <option value="Todos">
                    Todas las categorías
                </option>

                <option value="Romance">
                    Romance
                </option>

                <option value="Terror">
                    Terror
                </option>

                <option value="Comedia">
                    Comedia
                </option>

                <option value="Acción">
                    Acción
                </option>

                <option value="Drama">
                    Drama
                </option>

                <option value="Fantasía">
                    Fantasía
                </option>

                <option value="Comic">
                    Comic
                </option>

                <option value="Manga">
                    Manga
                </option>

                <option value="Anime">
                    Anime
                </option>

                <option value="Poemas">
                    Poemas
                </option>

            </select>

        </div>


        <!-- LIBROS -->
        <div id="listaLibros" class="lista-libros">

            <!-- Los libros aparecerán aquí mediante JavaScript -->

        </div>

    </section>


    <!-- CREAR LIBRO -->
    <section id="crear" class="pantalla">

        <h2>✍️ Crear una historia</h2>

        <form id="formularioLibro">

            <label for="titulo">
                Título
            </label>

            <input
                type="text"
                id="titulo"
                placeholder="Título de tu historia"
                required
            >


            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                placeholder="¿De qué trata tu historia?"
                rows="5"
            ></textarea>


            <label>
                Categoría
            </label>

            <div class="categorias">

                <label>
                    <input type="checkbox" value="Romance">
                    Romance
                </label>

                <label>
                    <input type="checkbox" value="Terror">
                    Terror
                </label>

                <label>
                    <input type="checkbox" value="Comedia">
                    Comedia
                </label>

                <label>
                    <input type="checkbox" value="Acción">
                    Acción
                </label>

                <label>
                    <input type="checkbox" value="Drama">
                    Drama
                </label>

                <label>
                    <input type="checkbox" value="Fantasía">
                    Fantasía
                </label>

                <label>
                    <input type="checkbox" value="Comic">
                    Comic
                </label>

                <label>
                    <input type="checkbox" value="Manga">
                    Manga
                </label>

                <label>
                    <input type="checkbox" value="Anime">
                    Anime
                </label>

                <label>
                    <input type="checkbox" value="Poemas">
                    Poemas
                </label>

            </div>


            <label for="portada">
                Portada
            </label>

            <input
                type="file"
                id="portada"
                accept="image/*"
            >


            <button type="submit">
                📚 Crear libro
            </button>

        </form>

    </section>


    <!-- LECTOR -->
    <section id="lector" class="pantalla">

        <button id="volverBiblioteca">
            ← Volver a la biblioteca
        </button>

        <div id="informacionLibro">
            <!-- Información del libro -->
        </div>

        <div id="capitulos">
            <!-- Capítulos -->
        </div>

    </section>


    <!-- EDITOR DE LIBRO -->
    <section id="editor" class="pantalla">

        <button id="volverMisLibros">
            ← Volver
        </button>

        <h2>✍️ Editor de historia</h2>

        <div id="datosLibro">
            <!-- Datos del libro -->
        </div>

        <div class="editor-capitulo">

            <input
                type="text"
                id="tituloCapitulo"
                placeholder="Título del capítulo"
            >

            <textarea
                id="textoCapitulo"
                placeholder="Escribe tu historia aquí..."
                rows="15"
            ></textarea>

            <button id="guardarCapitulo">
                💾 Guardar capítulo
            </button>

        </div>

        <div id="listaCapitulos">
            <!-- Capítulos creados -->
        </div>

    </section>

</main>


<!-- PIE DE PÁGINA -->
<footer>

    <p>
        📚 Biblioteca Virtual
    </p>

    <p>
        Una plataforma para lectores y escritores.
    </p>

</footer>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
